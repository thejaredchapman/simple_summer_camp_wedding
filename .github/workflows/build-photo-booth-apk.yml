name: Build Photo Booth APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'photo-booth-app/**'
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: photo-booth-app
        run: npm install

      - name: Build web assets
        working-directory: photo-booth-app
        # Without this, VITE_BACKEND_URL falls back to localhost:3001 (the
        # dev default in photoboothApi.js) baked right into the APK — on a
        # real phone that's the phone itself, not a server, so every fetch
        # fails with "Failed to fetch". Same backend URL the main site's
        # production build already points at.
        env:
          VITE_BACKEND_URL: https://camp-javery-backend.onrender.com
        run: npm run build

      - name: Add Android platform and sync
        working-directory: photo-booth-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Add CAMERA permission
        # @capacitor-community/camera-preview doesn't merge this into the
        # manifest automatically, and android/ is gitignored (regenerated
        # fresh here each run), so it has to be (re-)injected every build.
        working-directory: photo-booth-app
        run: |
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml

      - name: Generate app icon and splash screen
        # android/ is gitignored and regenerated fresh every run, so the
        # launcher icon (from photo-booth-app/assets/logo.png) has to be
        # (re-)generated every build too.
        working-directory: photo-booth-app
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#FAF8F3' --iconBackgroundColorDark '#2D5A3D' \
            --splashBackgroundColor '#FAF8F3' --splashBackgroundColorDark '#2D5A3D'

      - name: Build debug APK
        working-directory: photo-booth-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-booth-debug-apk
          path: photo-booth-app/android/app/build/outputs/apk/debug/app-debug.apk
